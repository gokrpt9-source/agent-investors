# portfolio.yaml — current holdings reviewed by the committee.
# /committee-setup asks for the values below; until then every holding has null shares and
# weights and `python scripts/committee.py validate-config` reports "run /committee-setup".
#
# Per holding give EITHER `shares` (preferred; valued at the latest close of `ticker`, or of
# `proxy_ticker` when set) OR `weight_pct` (percent of the whole portfolio, 0–100). If any
# holding uses weight_pct without shares, `total_value_usd` is required. If both shares and
# weight_pct are given, shares win.
#
# Field reference:
#   ticker               Yahoo-style symbol (BRK-B, not BRK.B). Quote tickers in YAML.
#   asset_type           stock | fund (optional; classification falls back to Yahoo/SEC data)
#   shares               number of shares/units held (> 0)
#   weight_pct           percent of total portfolio value (> 0, <= 100)
#   cost_basis           AVERAGE COST PER SHARE (optional) — enables the capital-gains tax note
#   cost_basis_currency  currency of cost_basis (USD default)
#   purchase_date        YYYY-MM-DD (optional; quoted)
#   currency             trading currency of the holding
#   proxy_ticker         US-listed proxy used for prices/look-through. Use it for the real TASE
#                        UCITS funds you hold, e.g. a NASDAQ-100 tracker on TASE -> proxy "QQQ",
#                        an S&P 500 momentum tracker -> "SPMO".
#   sector_override      force a GICS sector key (e.g. financials) instead of auto-classification
#
# Portfolio-level: give cash as cash_usd OR cash_pct (not both).

as_of: "2026-10-23"               # holdings as listed by the investor (2026-10-25); prices/FX below are 2026-10-23 closes
total_value_usd: null             # not needed: every holding is entered by shares
cash_usd: 1285.32               # $1,227.24 (USD cash position) + ILS 180.00 (= $58.08 at USD/ILS 3.0991)
cash_pct: null

